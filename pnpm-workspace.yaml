# Pin exact versions on install (no ^ ranges).
saveExact: true

# Only install package versions published for at least one week.
minimumReleaseAge: 10080

# First-party package — skip pnpm's minimum-release-age freshness gate.
minimumReleaseAgeExclude:
  - astro-bulma

allowBuilds:
  esbuild: true
  sharp: true
